# GM (掘金量化) — 内置数据源插件
# SDK 通过独立 venv (data/gm-env) 运行, 不污染后端主 venv
# (gm 3.0.190 钉死 numpy 1.x / pandas 1.x, 与主 venv 冲突, 见 provider docstring)。
# 需配置 GM_API_KEY (掘金终端「系统设置-密钥管理」生成), 未配置时插件灰显不可切换。

name: gm
display_name: "GM (掘金量化)"
runtime: python
entry: app.plugins.gm.provider:GmProvider
check: app.plugins.gm.provider:availability
datasets: [realtime, depth5, daily, adj_factor, minute, full_minute, financial]
api_key_env: GM_API_KEY   # 声明后设置页提供 Key 输入框(先探后存, secrets.json 优先)
description: "掘金量化数据服务(独立 venv 子进程桥接): 实时快照(含五档)、日K(原始价)、除权因子、分钟K、全量分钟、财务三表与指标;北交所暂不支持,自动回退 TickFlow。"
install_hint: "首次使用自动创建独立数据环境(需本机有 uv, 约 1 分钟); 在下方输入框填写 GM Token(掘金终端密钥管理生成), 或配置环境变量 GM_API_KEY"
homepage: "https://www.myquant.cn"
